<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grimtale</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e0c10;--panel:#19161d;--panel2:#221e27;--line:#332d3a;--text:#ece6f0;--mut:#9a91a3;--gold:#f2c14e;--red:#e0484e;--green:#56c271;--acc:#c0563a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
body{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.lvl{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7a2e22,#3a1612);display:grid;place-items:center;font-weight:800;font-size:15px;border:1px solid #9a4a32}
.xpw{flex:1}
.xpl{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.bar{height:7px;background:#2a2430;border-radius:4px;overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;width:0;transition:width .15s}
.gold{font-weight:800;color:var(--gold);font-size:15px;white-space:nowrap}
.cur{text-align:right;line-height:1.15}.souls{font-weight:700;color:#ff9a4a;font-size:12px;white-space:nowrap}.ashv{color:#c9b8a8;margin-left:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:14px}.card .hint{margin:4px 0}
.resg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.resg div{background:var(--panel2);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{padding:6px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.chips button.act{border-color:#e8455a;color:#fff}.chips button.lockd{opacity:.45}.sub.need.ok{color:var(--green)}.sub.need.bad{color:#ff8a65}.diffs{margin:4px 0 2px}.logl{font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--txt)}.logl span{color:var(--mut);margin-right:4px}.chips button:disabled{opacity:.35}
.step{display:flex;align-items:center;gap:8px;margin:6px 0}.step .btn{padding:4px 12px}
.tabs button{padding:11px 1px;font-size:12px}
.arenah{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.arenah div{background:var(--panel2);border-radius:8px;padding:6px 4px}.arenah b{display:block;font-size:15px}.arenah span{font-size:11px;color:var(--mut)}
.rank div{display:flex;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid #ffffff0d}.rank b{width:28px;text-align:center}.rank span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank i{font-style:normal;font-weight:700;color:var(--gold)}.rank .me{background:#2c1d1f;border-radius:8px}
.reflink{background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:7px 8px;font-size:12px;word-break:break-all;margin-top:8px;color:#d4ccdb;user-select:all}
.inp{flex:2;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font:inherit}
.bars{display:flex;gap:3px;align-items:flex-end;height:90px;margin-top:8px}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.bars i{display:block;width:100%;background:linear-gradient(#c0563a,#6b2516);border-radius:3px 3px 0 0;min-height:2px}.bars b{font-size:9px;color:#ddd}.bars span{font-size:9px;color:var(--mut)}
.card.admin{border-color:#7a5a26}
.dngv{position:fixed;inset:0;z-index:15;background:#000;display:flex;flex-direction:column;overflow:hidden}
.dv-bg{position:absolute;inset:-10px;background-size:cover;background-position:center;filter:brightness(.55) saturate(.9);animation:dvzoom 40s linear infinite alternate}
@keyframes dvzoom{to{transform:scale(1.08)}}
.dv-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 14px 30px;background:linear-gradient(#000d,transparent)}
.dv-top b{display:block;font-size:18px}.dv-top span{font-size:13px;color:#e7d9c0}.dv-top .btn{padding:9px 14px}
.dv-rooms{position:relative;z-index:2;display:flex;gap:6px;justify-content:center}.dv-rooms i{width:26px;height:8px;border-radius:4px;background:#ffffff22}.dv-rooms i.b{width:38px}.dv-rooms i.cur{background:var(--gold)}.dv-rooms i.ok{background:var(--green)}.dv-rooms i.bad{background:var(--red)}
.dv-f{position:relative;z-index:2;flex:1;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:0 12px 20vh}
.dngv .f{width:46%;display:flex;flex-direction:column;align-items:center;min-width:0}.dngv .sprite{max-width:100%;display:flex;justify-content:center}.dngv .sprite img{height:min(150px,21vh);max-width:100%;object-fit:contain}.dngv .mob .sprite.big img{height:min(190px,27vh)}.dngv .hpb{height:9px;width:100%}.dngv .fname{max-width:100%;text-align:center}
.card.ovf{border-color:#8a5a20;background:#241a10}.chestbar.vault{background:linear-gradient(135deg,#1d2433,#121722);border-color:#3c5a8a}
.mats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mats div{background:var(--panel2);border-radius:8px;padding:8px 4px;text-align:center}.mats i{font-style:normal;font-size:18px;display:block}.mats b{display:block;font-size:16px}.mats span{font-size:11px;color:var(--mut)}
.scene{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 16px;height:min(170px,24vh);border-bottom:1px solid var(--line);background-size:cover;background-position:center}
body[data-scene=forge] .arena,body[data-scene=clan] .arena{display:none}body[data-scene=forge] .scene,body[data-scene=clan] .scene{display:flex}
body[data-scene=forge] .scene{background-image:radial-gradient(ellipse at center,#000a 0%,#0005 45%,transparent 75%),linear-gradient(0deg,#0b0a0fcc,transparent 40%),url(assets/forge.webp)}
body[data-scene=clan] .scene{background-image:radial-gradient(ellipse at center,#000a 0%,#0005 45%,transparent 75%),linear-gradient(0deg,#0b0a0fcc,transparent 40%),url(assets/clan.webp)}
.scene .sc-ic{display:none}.scene b{display:block;font-size:22px;text-shadow:0 2px 6px #000,0 0 14px #000}.scene span{font-size:12px;color:#e6dcef;text-shadow:0 1px 4px #000;max-width:280px}
.resg div.wide{grid-column:1/-1}
.pvp{display:grid;gap:8px;margin:10px 0;text-align:left}.pvp span{font-size:12px;color:#d4ccdb}
.dcard{display:flex;gap:10px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.dcard .th{width:76px;min-height:76px;border-radius:9px;background-size:cover;background-position:center;flex:none;position:relative}
.dcard .th b{position:absolute;left:4px;top:4px;background:#000b;border-radius:6px;padding:1px 6px;font-size:11px}
.dcard .info{flex:1;min-width:0}.dcard .nm{font-weight:700}.dcard .sub{font-size:11px;color:var(--mut)}
.dcard .rw{font-size:12px;margin:3px 0}.dcard .btn{padding:7px 10px;font-size:12px;margin-top:4px}
.dcard.lock{opacity:.45}.est{font-weight:700}
.rooms div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ffffff10;opacity:0;transition:opacity .25s}
.rooms div.show{opacity:1}
.chestbar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#3a2a14,#22180c);border:1px solid #7a5a26;border-radius:12px;padding:9px 10px;margin-bottom:10px}
.chestbar span{flex:1;font-weight:700}
.chestbar .chg{display:inline-block;flex:none;margin-right:10px;white-space:nowrap}
.arena{position:relative;height:232px;overflow:hidden;border-bottom:1px solid var(--line);background-size:cover;background-position:center 75%}
.arena::after{content:'';position:absolute;inset:0;background:linear-gradient(#000a,#0003 30%,#0003 70%,#0008);pointer-events:none}
.ahead{position:absolute;top:6px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;z-index:2}
.nav{width:30px;height:30px;border-radius:8px;background:#0008;border:1px solid #fff2;font-size:16px}
.nav:disabled{opacity:.25}
.stage{text-align:center;min-width:150px}
.stage b{display:block;font-size:15px}
.stage span{font-size:11px;color:#cfc4d8}
.fighters{position:absolute;inset:46px 26px 48px;display:flex;justify-content:space-between;align-items:flex-end}
.f{width:38%;text-align:center}
.sprite{font-size:64px;line-height:1.1;transition:transform .12s;display:inline-block;filter:drop-shadow(0 8px 6px #000b)}
.sprite img{height:104px;width:auto;display:block;transform-origin:50% 100%;animation:breathe 1.7s ease-in-out infinite}
.mob .sprite img{height:100px;animation-delay:-.6s}
.mob .sprite.big img{height:132px}
.sprite .emo{display:inline-block}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.965)}}
.sprite.die{animation:die .42s forwards}
@keyframes die{0%{filter:brightness(2.5);transform:none}100%{filter:brightness(.2) blur(2px);transform:translateY(16px) scale(.85);opacity:0}}
.sprite.appear{animation:appear .35s}
@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
.ember{position:absolute;width:5px;height:5px;border-radius:1px;pointer-events:none;z-index:3;animation:ember .9s forwards}
@keyframes ember{to{transform:translate(var(--dx),-70px);opacity:0}}
.hit{animation:hit .25s}
@keyframes hit{0%{filter:brightness(1.8) drop-shadow(0 0 6px #fff8)}100%{filter:brightness(1) drop-shadow(0 8px 6px #000b)}}
.lunge-r{transform:translateX(30px) rotate(4deg)!important}
.lunge-l{transform:translateX(-30px) rotate(-4deg)!important}
.fname{font-size:12px;color:#ddd;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpb{height:7px;background:#0009;border-radius:5px;overflow:hidden;margin-top:4px;border:1px solid #fff1}
.hpb>i{display:block;height:100%;background:linear-gradient(90deg,#b8323a,#e45a4f);transition:width .12s}
.hero .hpb>i{background:linear-gradient(90deg,#2f9a52,#5fd07c)}
.hpt{font-size:10px;color:#bbb}
.bossrow{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:8px;align-items:center;z-index:2}
.bbtn{flex:1;padding:9px;border-radius:10px;background:#3b1a1a;border:1px solid #6b2a2a;font-weight:700;color:#f3c2b6}
.bbtn.ready{background:linear-gradient(135deg,#b5402b,#6d1e16);border-color:#ff8a6a;color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px #ff6b4a}}
.bbtn:disabled{opacity:.45;animation:none}
.tog{padding:9px 10px;border-radius:10px;background:#0008;border:1px solid #fff2;font-size:12px;white-space:nowrap}
.tog.on{border-color:var(--green);color:var(--green)}
.timer{position:absolute;left:12px;right:12px;bottom:48px;height:5px;background:#0008;border-radius:3px;overflow:hidden;display:none;z-index:2}
.timer>i{display:block;height:100%;background:var(--gold)}
.dmg{position:absolute;font-weight:800;font-size:15px;pointer-events:none;animation:up .8s forwards;text-shadow:0 2px 3px #000;z-index:3}
.dmg.crit{color:var(--gold);font-size:19px}
.dmg.taken{color:#ff6b6b}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
.dead{position:absolute;inset:0;display:none;place-items:center;background:#000a;font-size:20px;font-weight:800;z-index:4;color:#ff7a7a}
.tabsw{position:sticky;top:59px;z-index:4}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.subtabs{display:none;gap:6px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{flex:1;padding:7px 8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.subtabs button.act{border-color:var(--acc);color:#fff;background:#2c1d1f}
.tabs button{flex:1;padding:11px 2px;font-size:11.5px;background:none;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;position:relative}
.tabs button.act{color:var(--text);border-color:var(--acc)}
.badge{position:absolute;top:5px;right:12%;background:var(--red);color:#fff;font-size:10px;border-radius:8px;padding:0 5px}
.pane{padding:12px;display:none;flex:1}
.pane.act{display:block}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:84px;text-align:center}
.slot .ic{font-size:26px}
.svi{width:1.05em;height:1.05em;vertical-align:-.18em;display:inline-block}
.slot .sn{font-size:10px;color:var(--mut)}
.slot .it{font-size:11px;font-weight:600;margin-top:2px}
.stats{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.stats div{display:flex;justify-content:space-between}
.stats span{color:var(--mut)}
.btn{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:linear-gradient(135deg,#a8452e,#6b2516);border-color:#c76048;color:#fff}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row .btn{flex:1}
.item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid;border-radius:10px;padding:8px;margin-bottom:7px}
.item .ic{font-size:26px;width:34px;text-align:center}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:13px}
.item .sub{font-size:11px;color:var(--mut)}
.item .st{font-size:12px}
.up{color:var(--green)}.dn{color:var(--red)}
.item .acts{display:flex;flex-direction:column;gap:5px}
.item .acts .btn{padding:6px 9px;font-size:12px;white-space:nowrap}
.upg{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.upg .ic{font-size:28px}
.upg .info{flex:1}
.upg .info b{display:block}
.upg .info span{font-size:12px;color:var(--mut)}
.upg>.btn{min-width:92px}
.ubtns{display:flex;gap:6px;width:100%}.ubtns .btn{flex:1;padding:8px 6px;font-size:12px}.ubtns .btn.pri{flex:1.6}
.gate{display:flex;gap:8px;align-items:center;width:100%;background:#2a2016;border:1px solid #6b5126;border-radius:9px;padding:6px 8px}.gate span{flex:1;font-size:12px;color:#f0d9a8}.gate .btn{padding:7px 10px;font-size:12px}
.log div{font-size:12px;padding:5px 0;border-bottom:1px solid #ffffff0d;color:#d4ccdb}
.empty{color:var(--mut);text-align:center;padding:24px 0}
#tut{position:fixed;inset:0;z-index:19;pointer-events:none;display:none}#tut.show{display:block}#tut.block{pointer-events:auto}
.tring{position:fixed;border:2px solid var(--gold);border-radius:10px;box-shadow:0 0 0 9999px #000a;pointer-events:none;transition:all .2s;animation:tpulse 1.4s infinite}
@keyframes tpulse{50%{border-color:#fff3}}
.tbub{position:fixed;left:12px;right:12px;max-width:440px;margin:0 auto;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;pointer-events:auto;box-shadow:0 6px 24px #000c}
.tbub p{margin:0 0 10px;line-height:1.4}.tstep{font-size:12px;color:var(--mut);margin-bottom:4px}
.newsb{text-align:left;max-height:55vh;overflow:auto;line-height:1.45;margin:6px 0 4px}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:20px}
.modal.show{display:grid}
.mbox{background:var(--panel);border:1px solid #4a3d55;border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center}
.mbox h3{margin:0 0 8px;font-size:18px}
.mbox p{margin:6px 0;color:#d4ccdb}
.mbox .big{font-size:44px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.days div{background:var(--panel2);border-radius:6px;padding:5px 0;font-size:10px;color:var(--mut)}
.days div.got{background:#2d4a33;color:#bff0c9}
.days div.now{outline:2px solid var(--gold);color:#fff}
.toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:#2b2232;border:1px solid #5a4866;padding:8px 14px;border-radius:10px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--mut);margin:8px 0}
.filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.filter button{padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.filter button.act{border-color:var(--acc);color:#fff}
.chips .chip{padding:5px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.gem{display:inline-flex;align-items:center;color:var(--gc);font-size:13px;line-height:1;text-shadow:0 0 4px var(--gc)}.gem i{font-style:normal;font-size:8px;font-weight:800;color:#fff;margin-left:1px;text-shadow:none}.gem.big{font-size:18px}.gem.big i{font-size:10px}.gem.empty{color:#5a5560;text-shadow:none}
.socks{display:inline-flex;gap:3px;vertical-align:middle}
.gemg{display:flex;flex-direction:column;gap:6px}.gemrow{display:flex;align-items:center;gap:4px}.gname{width:74px;font-size:12px;font-weight:700}
.gcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 2px;font-size:12px}.gcell.dim{opacity:.4}
.btn.mini{padding:2px 6px;font-size:10px;min-height:0}
.socrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sock{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:6px 6px;border-radius:9px;border:1px dashed var(--line);background:var(--panel2);color:var(--mut);font-size:16px}.sock.full{border-style:solid}.sock small{font-size:10px;color:var(--text)}.sock small.out{color:var(--mut)}
.gpick{display:flex;flex-direction:column;gap:6px;margin-top:8px}.gpick .btn{display:flex;align-items:center;gap:6px;justify-content:flex-start}.gpick small{margin-left:auto;color:var(--mut)}
.f.hero{position:relative}.petf{position:absolute;left:-4px;bottom:34px;font-size:30px;z-index:2;filter:drop-shadow(0 4px 4px #000c);animation:petb 2.2s ease-in-out infinite}.petf.evo1{font-size:36px}.petf.evo2{font-size:42px;filter:drop-shadow(0 0 8px #ffcf6a) drop-shadow(0 4px 4px #000c)}
@keyframes petb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pet-ic{font-size:26px;line-height:1}.pet-ic.big{font-size:64px;filter:drop-shadow(0 0 10px #c0563a88)}.petmain{display:flex;gap:14px;align-items:center}.petmain h4{margin:0 0 4px}
.stars{color:#f0c050;letter-spacing:1px}.stars i{font-style:normal;color:#4a4450}
.petfind{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:13px}
.petinc{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.petinc>div{flex:1}.egg{font-size:22px}.egg.r{filter:hue-rotate(200deg) saturate(2) drop-shadow(0 0 4px #7aa8ff)}
.petgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.petc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12px;text-align:center}.petc.act{border-color:var(--acc);background:#2c1d1f}.petc.no{opacity:.45}.petc small{color:var(--mut);font-size:10px}
</style>
</head>
<body>
<div class="top">
  <div class="lvl" id="lvl">1</div>
  <div class="xpw">
    <div class="xpl"><span id="pw">Сила 0</span><span id="xpt">0/0</span></div>
