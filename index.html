<script>
/* Заставка «Книга казок» (04.11, рішення Влада). Показується до завантаження коду гри; game.js керує нею через window.Splash. */
(function(){
 var B=document.getElementById('boot'),$=function(i){return document.getElementById(i)};
 var lang=(function(){try{var v=localStorage.getItem('gt_lang');if(v==='uk'||v==='en'||v==='ru')return v}catch(e){}
  var w=window.Telegram&&window.Telegram.WebApp,u=w&&w.initDataUnsafe&&w.initDataUnsafe.user,c=String((u&&u.language_code)||navigator.language||'').slice(0,2).toLowerCase();
  return c==='uk'?'uk':['ru','be','kk','uz','ky','tg','hy','az'].indexOf(c)>=0?'ru':'en'})();
 var TX={uk:{open:'РОЗКРИВАЄМО КАЗКУ',opening:'КАЗКА ВІДКРИВАЄТЬСЯ…',rib:'темна казка',tips:['Тап по <b>рівню</b> чи фігурці героя відкриває спорядження й тренування.','<b>Вічні речі</b> можна вдосконалювати — але це дорого.','Ключі зі складу клану можна <b>подарувати</b> соклановцю.','Прорив кожні <b>25 рівнів</b> тренування потребує уламків і матеріалів.','<b>Підземелля</b>: 5 безкоштовних заходів щодня — не забувай!','Повний сет <b>прадавніх</b> речей дає +15% до всіх статів.']},
  en:{open:'OPENING THE TALE',opening:'THE TALE OPENS…',rib:'a dark tale',tips:['Tap your <b>level</b> or hero to open gear and training.','<b>Eternal items</b> can be refined — but it is costly.','Keys from clan storage can be <b>gifted</b> to a clanmate.','Every <b>25 training levels</b> needs a breakthrough with shards and materials.','<b>Dungeons</b>: 5 free runs every day — don’t miss them!','A full <b>ancient</b> set gives +15% to all stats.']},
  ru:{open:'РАСКРЫВАЕМ СКАЗКУ',opening:'СКАЗКА ОТКРЫВАЕТСЯ…',rib:'тёмная сказка',tips:['Тап по <b>уровню</b> или фигурке героя открывает снаряжение и тренировки.','<b>Вечные вещи</b> можно улучшать — но это дорого.','Ключи со склада клана можно <b>подарить</b> соклановцу.','Прорыв каждые <b>25 уровней</b> тренировки требует осколков и материалов.','<b>Подземелья</b>: 5 бесплатных заходов каждый день — не забывай!','Полный сет <b>древних</b> вещей даёт +15% ко всем статам.']}}[lang];
 var rb=B.querySelector('.bt-ribbon');if(rb)rb.textContent=TX.rib;
 for(var i=0;i<22;i++){var m=document.createElement('i');m.className='bt-mote';m.style.cssText='--x:'+(10+Math.random()*80)+'%;--y:'+(30+Math.random()*50)+'%;--d:'+(5+Math.random()*5)+'s;--dl:'+(-Math.random()*8)+'s;--dx:'+((Math.random()-.5)*60)+'px';B.appendChild(m)}
 var tips=TX.tips.slice().sort(function(){return Math.random()-.5}),ti=0,tp=$('bt_tip');tp.innerHTML=tips[0];
 var tt=setInterval(function(){tp.style.opacity=0;setTimeout(function(){ti=(ti+1)%tips.length;tp.innerHTML=tips[ti];tp.style.opacity=1},500)},3200);
 var p=0,goal=88,t0=Date.now(),pr=$('bt_prog'),pc=$('bt_pct'),done=false,failed=false;
 function show(){pr.style.strokeDashoffset=314.2*(1-p/100);pc.textContent=TX.open+' · '+Math.round(p)+'%'}
 var tk=setInterval(function(){if(failed)return;p+=(goal-p)*(done?.35:.045);if(done&&p>99.4)p=100;show()},90);
 window.Splash={
  set:function(v){goal=Math.max(goal,Math.min(95,v))},
  done:function(){if(done)return;done=true;goal=100;failed=false;B.classList.remove('bt-fail');
   var wait=Math.max(0,900-(Date.now()-t0));
   setTimeout(function(){var iv=setInterval(function(){if(p<100)return;clearInterval(iv);clearInterval(tk);pc.textContent=TX.opening;
    setTimeout(function(){B.classList.add('bt-open');setTimeout(function(){B.classList.add('bt-gone');setTimeout(function(){clearInterval(tt);B.remove();window.Splash=null},650)},2100)},250)},60)},wait)},
  error:function(msg,btn,cb){failed=true;B.classList.add('bt-fail');pc.textContent=msg;var e=B.querySelector('.bt-err');e.innerHTML=btn?'<button>'+btn+'</button>':'';if(btn)e.firstChild.onclick=function(){failed=false;B.classList.remove('bt-fail');cb&&cb()}}
 };
 show();
})();
</script>
